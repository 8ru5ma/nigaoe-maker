<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>似顔絵メーカー</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;color:#1a1714;font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;min-height:100vh;}
#app-root{display:flex;flex-direction:column;min-height:100vh;}

.header{background:#fff;border-bottom:1.5px solid #e4dfd8;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(42,31,26,.06);}
.logo{font-size:18px;font-weight:700;letter-spacing:.04em;color:#1a1714;flex:1;min-width:110px;}
.logo span{color:#c86060;}
.btn{background:#fff;border:1.5px solid #e4dfd8;color:#1a1714;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap;}
.btn:hover{background:#f5f3f0;border-color:#b0a89e;}
.btn-primary{background:#1a1714;color:#fff;border-color:#1a1714;}
.btn-primary:hover{background:#3a2f28;}
.btn-active{background:#1a1714;color:#fff;border-color:#1a1714;}

.cat-bar{background:#fff;border-bottom:1.5px solid #e4dfd8;overflow-x:auto;display:flex;padding:0 10px;scrollbar-width:none;white-space:nowrap;flex-shrink:0;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-tab{padding:10px 15px;cursor:pointer;font-size:13px;font-weight:600;color:#7a6f66;border-bottom:2.5px solid transparent;flex-shrink:0;transition:all .15s;user-select:none;}
.cat-tab:hover{color:#1a1714;}
.cat-tab.active{color:#1a1714;border-bottom-color:#1a1714;}

.main{display:flex;flex:1;min-height:0;}
.preview-area{flex:1;min-width:0;padding:24px;display:flex;justify-content:center;align-items:flex-start;background:#f5f3f0;}
.preview-wrap{width:100%;max-width:380px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 24px rgba(42,31,26,.10);aspect-ratio:340/400;}
.preview-wrap svg{width:100%;height:100%;display:block;}

.panel-area{width:340px;min-width:260px;border-left:1.5px solid #e4dfd8;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
.sub-tabs{display:flex;border-bottom:1.5px solid #e4dfd8;flex-shrink:0;}
.sub-tab{flex:1;padding:9px 4px;font-size:12px;font-weight:600;color:#7a6f66;background:none;border:none;cursor:pointer;text-align:center;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s;}
.sub-tab.active{color:#1a1714;border-bottom-color:#1a1714;}
.sub-content{flex:1;overflow-y:auto;padding:14px;}

.parts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.part-thumb{background:#f5f3f0;border:2px solid transparent;border-radius:10px;cursor:pointer;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;}
.part-thumb:hover{border-color:#b0a89e;}
.part-thumb.active{border-color:#1a1714;background:#fff;}
.part-thumb svg{width:100%;height:100%;display:block;}
.part-label{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:#7a6f66;font-weight:600;pointer-events:none;}

.color-section{margin-bottom:18px;}
.color-section-title{font-size:11px;font-weight:700;color:#7a6f66;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}
.color-swatches{display:flex;flex-wrap:wrap;gap:7px;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;flex-shrink:0;}
.swatch:hover{transform:scale(1.15);}
.swatch.active{border-color:#1a1714;box-shadow:0 0 0 2px #fff inset;}

.adj-section{margin-bottom:16px;}
.adj-label{font-size:12px;font-weight:700;color:#3a2f28;margin-bottom:8px;}
.adj-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.adj-name{font-size:11px;color:#7a6f66;width:60px;flex-shrink:0;}
.adj-slider{flex:1;accent-color:#1a1714;cursor:pointer;}
.adj-nudge{width:26px;height:26px;border:1.5px solid #e4dfd8;background:#fff;border-radius:5px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:#1a1714;line-height:1;}
.adj-nudge:hover{background:#f5f3f0;}
.adj-val{font-size:10px;color:#b0a89e;width:26px;text-align:right;flex-shrink:0;}

.bg-row{display:flex;gap:10px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.bg-opt{width:32px;height:32px;border-radius:6px;border:2.5px solid #e4dfd8;cursor:pointer;transition:all .15s;flex-shrink:0;}
.bg-opt:hover{transform:scale(1.08);}
.bg-opt.active{border-color:#1a1714;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:340px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px;}
.modal p{font-size:13px;color:#7a6f66;margin-bottom:18px;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.modal-btns .btn{flex:1;}
.modal-cancel{text-align:right;}

.no-adj{color:#b0a89e;font-size:13px;padding:8px 0;}

@media(max-width:680px){
  .main{flex-direction:column;}
  .panel-area{width:100%;min-width:0;border-left:none;border-top:1.5px solid #e4dfd8;}
  .preview-area{padding:14px;}
  .preview-wrap{max-width:280px;}
}
</style>
</head>

      flowers.push({x:fx,y:fy});
    }
    return <>{flowers.map(({x,y},i)=><g key={i}>
      {[0,1,2,3,4].map(j=>{const a=j*Math.PI*2/5;return <ellipse key={j} cx={x+Math.cos(a)*7} cy={y+Math.sin(a)*7} rx={4} ry={4} fill={accent} stroke={ink} strokeWidth={1.2}/>;})}</g>)}</>;
  }},
  ha4:{label:'リボン',Comp:({accent,ink})=><>
    <path d="M153 84 C141 68 118 66 114 77 C110 89 130 97 153 90Z" fill={accent} stroke={ink} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
    <path d="M187 84 C199 68 222 66 226 77 C230 89 210 97 187 90Z" fill={accent} stroke={ink} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
    <ellipse cx={170} cy={87} rx={15} ry={11} fill={accent} stroke={ink} strokeWidth={2.5}/>
    <circle cx={170} cy={87} r={6} fill="#fff" stroke={ink} strokeWidth={2}/>
  </>},
  ha5:{label:'ヘアピン',Comp:({accent,ink})=><>
    <rect x={106} y={101} width={32} height={7} rx={3.5} fill={accent} stroke={ink} strokeWidth={2} transform="rotate(-18,122,104)"/>
    <circle cx={109} cy={96} r={6} fill="#ffe08a" stroke={ink} strokeWidth={2}/>
    <circle cx={109} cy={96} r={3} fill={accent}/>
  </>},
  ha6:{label:'葉っぱ',Comp:({accent,ink})=><>
    <path d="M106 96 C98 74 122 58 144 70 C132 80 118 88 106 96Z" fill={accent} stroke={ink} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
    <path d="M106 96 C118 82 136 74 144 70" fill="none" stroke={ink} strokeWidth={1.5} strokeLinecap="round"/>
    <line x1={106} y1={96} x2={118} y2={76} stroke={ink} strokeWidth={1} strokeLinecap="round" opacity={0.5}/>
  </>},
  ha7:{label:'星',Comp:({accent,ink})=>{
    const pts=Array.from({length:10},(_,i)=>{const a=Math.PI*i/5-Math.PI/2,r=i%2===0?22:9;return `${170+r*Math.cos(a)} ${72+r*Math.sin(a)}`;}).join('L');
    return <path d={`M${pts}Z`} fill={accent} stroke={ink} strokeWidth={2.5} strokeLinejoin="round"/>;
  }},
  ha8:{label:'ベレー帽',Comp:({accent,ink})=><>
    <path d="M64 146 C60 98 104 50 170 50 C236 50 280 98 276 146 C268 133 248 118 226 114 C202 109 192 120 192 120 C186 108 180 104 170 104 C160 104 154 108 148 120 C148 120 138 109 114 114 C92 118 72 133 64 146Z" fill={accent} stroke={ink} strokeWidth={2.8} strokeLinejoin="round" strokeLinecap="round"/>
    <ellipse cx={170} cy={106} rx={26} ry={9} fill={accent} stroke={ink} strokeWidth={2.5}/>
  </>},
  ha9:{label:'ニット帽',Comp:({accent,ink})=><>
    <path d="M66 146 C62 94 104 46 170 46 C236 46 278 94 274 146 C260 138 240 130 226 130 C208 128 196 134 170 134 C144 134 132 128 114 130 C100 130 80 138 66 146Z" fill={accent} stroke={ink} strokeWidth={2.8} strokeLinejoin="round" strokeLinecap="round"/>
    <ellipse cx={170} cy={50} rx={24} ry={16} fill={accent} stroke={ink} strokeWidth={2.5}/>
    <circle cx={170} cy={36} r={10} fill="#fce8a0" stroke={ink} strokeWidth={2.5}/>
    {[0,1,2,3,4,5,6,7].map(i=>{const x=80+i*28;return x<258?<line key={i} x1={x} y1={130} x2={x+5} y2={146} stroke={ink} strokeWidth={1.5} strokeLinecap="round"/>:null;})}
  </>},
};

// ── SVG Layer Components ──────────────────────────────────────────────────
function BackHair({selected,colors,adj}){
  const s=BACK_HAIR[selected.backHair];
  if(!s||!s.Comp)return null;
  return <s.Comp hair={colors.backHair} ink={colors.ink} accent={colors.accent}/>;
}
function Face({selected,colors,adj}){
  const s=FACE_SHAPES[selected.face];
  if(!s||!s.Comp)return null;
  return <s.Comp skin={colors.skin} ink={colors.ink} adj={adj}/>;
}
function Body({colors}){
  const {skin,ink}=colors;
  return <>
    <path d="M122 332 C108 344 92 358 76 372 C62 382 50 392 46 400 L294 400 C290 392 278 382 264 372 C248 358 232 344 218 332 C208 325 198 320 190 317 C182 314 177 313 170 313 C163 313 158 314 150 317 C142 320 132 325 122 332Z" fill={skin} stroke={ink} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
    <path d="M46 400 C52 388 64 378 80 368 C96 357 116 346 128 336 C138 329 148 323 158 320 C163 318 167 317 170 317 C173 317 177 318 182 320 C192 323 202 329 212 336 C224 346 244 357 260 368 C276 378 288 388 294 400" fill="#e6d2c0" stroke={ink} strokeWidth={1.8} strokeLinejoin="round" strokeLinecap="round"/>
  </>;
}
function FrontHair({selected,colors,adj}){
  const s=FRONT_HAIR[selected.frontHair];
  if(!s||!s.Comp)return null;
  return <s.Comp hair={colors.frontHair} ink={colors.ink}/>;
}
function Brows({selected,colors,adj}){
  const s=BROW_SHAPES[selected.brows];
  if(!s)return null;
  const {ink}=colors;
  const ex1=170-adj.eyeX, ex2=170+adj.eyeX;
  const by=adj.browY, ang=adj.browAngle||0;
  return <>
    <g transform={`rotate(${ang},${ex1},${by})`}><s.Left cx={ex1} cy={by} ink={ink}/></g>
    <g transform={`rotate(${-ang},${ex2},${by})`}><s.Right cx={ex2} cy={by} ink={ink}/></g>
  </>;
}
function Eyes({selected,colors,adj}){
  const s=EYE_SHAPES[selected.eyes];
  if(!s)return null;
  const {iris,ink}=colors;
  const ex1=170-adj.eyeX, ex2=170+adj.eyeX;
  const ey=adj.eyeY, es=adj.eyeSize/100;
  return <g transform={`translate(170,${ey}) scale(${es}) translate(${-170},${-ey})`}>
    <s.Left cx={ex1} cy={ey} iris={iris} ink={ink}/>
    <s.Right cx={ex2} cy={ey} iris={iris} ink={ink}/>
  </g>;
}
function Nose({selected,colors,adj}){
  const s=NOSE_SHAPES[selected.nose];
  if(!s||!s.Comp)return null;
  const ny=adj.noseY, ns=adj.noseSize/100;
  return <g transform={`translate(170,${ny}) scale(${ns}) translate(-170,${-ny})`}>
    <s.Comp nx={170} ny={ny} ink={colors.ink} skin={colors.skin}/>
  </g>;
}
function Mouth({selected,colors,adj}){
  const s=MOUTH_SHAPES[selected.mouth];
  if(!s||!s.Comp)return null;
  const my=adj.mouthY, ms=adj.mouthSize/100;
  return <g transform={`translate(170,${my}) scale(${ms}) translate(-170,${-my})`}>
    <s.Comp mx={170} my={my} lips={colors.lips} ink={colors.ink}/>
  </g>;
}
function DecoHair({selected,colors,adj}){
  const s=DECO_HAIR[selected.decoHair];
  if(!s||!s.Comp)return null;
  return <s.Comp hair={colors.decoHair} ink={colors.ink} accent={colors.accent}/>;
}
function HeadAccessory({selected,colors,adj}){
  const s=HEAD_ACCESSORIES[selected.headAccessory];
  if(!s||!s.Comp)return null;
  return <s.Comp accent={colors.accent} ink={colors.ink}/>;
}

// ── Main SVG ──────────────────────────────────────────────────────────────
function FaceSvg({av,svgId,bgOverride}){
  const {selected,colors,adj,sketch,bg}=av;
  const bgFill=bgOverride!=null?bgOverride:(bg==='cream'?'#faf6ef':bg==='transparent'?'none':'#ffffff');
  return <svg id={svgId} viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="sk" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale={1.5} xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    {bgFill!=='none'&&<rect width={340} height={400} fill={bgFill}/>}
    <g filter={sketch?"url(#sk)":undefined}>
      <BackHair selected={selected} colors={colors} adj={adj}/>
      <Face selected={selected} colors={colors} adj={adj}/>
      <Body colors={colors}/>
      <FrontHair selected={selected} colors={colors} adj={adj}/>
      <Brows selected={selected} colors={colors} adj={adj}/>
      <Eyes selected={selected} colors={colors} adj={adj}/>
      <Nose selected={selected} colors={colors} adj={adj}/>
      <Mouth selected={selected} colors={colors} adj={adj}/>
      <DecoHair selected={selected} colors={colors} adj={adj}/>
      <HeadAccessory selected={selected} colors={colors} adj={adj}/>
    </g>
  </svg>;
}

// ── Thumbnail ─────────────────────────────────────────────────────────────
function Thumbnail({cat,partId,isActive,onClick}){
  const thumbAv=useMemo(()=>({
    selected:{...INITIAL.selected,[cat]:partId},
    colors:THUMB_COLORS,adj:THUMB_ADJ,sketch:false,bg:'white'
  }),[cat,partId]);
  const s=getShape(cat,partId);
  return <div className={`part-thumb${isActive?' active':''}`} onClick={onClick} title={s?s.label:partId}>
    <FaceSvg av={thumbAv} bgOverride="transparent"/>
    <span className="part-label">{s?s.label:partId}</span>
  </div>;
}

function getShape(cat,id){
  const maps={face:FACE_SHAPES,backHair:BACK_HAIR,frontHair:FRONT_HAIR,decoHair:DECO_HAIR,brows:BROW_SHAPES,eyes:EYE_SHAPES,nose:NOSE_SHAPES,mouth:MOUTH_SHAPES,headAccessory:HEAD_ACCESSORIES};
  return (maps[cat]||{})[id]||null;
}
function getPartIds(cat){
  const maps={face:FACE_SHAPES,backHair:BACK_HAIR,frontHair:FRONT_HAIR,decoHair:DECO_HAIR,brows:BROW_SHAPES,eyes:EYE_SHAPES,nose:NOSE_SHAPES,mouth:MOUTH_SHAPES,headAccessory:HEAD_ACCESSORIES};
  return Object.keys(maps[cat]||{});
}

// ── Color Swatches ────────────────────────────────────────────────────────
function ColorSection({label,palette,activeColor,onPick}){
  return <div className="color-section">
    <div className="color-section-title">{label}</div>
    <div className="color-swatches">
      {palette.map(c=><div key={c} className={`swatch${activeColor===c?' active':''}`} style={{background:c,outline:c==='#fff'||c==='#fde8cc'?'1px solid #e4dfd8':'none'}} onClick={()=>onPick(c)}/>)}
    </div>
  </div>;
}

// ── Adj Slider Row ────────────────────────────────────────────────────────
function AdjRow({label,name,value,min,max,step,onChange}){
  const s=step||1;
  return <div className="adj-row">
    <div className="adj-name">{label}</div>
    <button className="adj-nudge" onClick={()=>onChange(name,Math.max(min,value-s))}>−</button>
    <input type="range" className="adj-slider" min={min} max={max} step={s} value={value} onChange={e=>onChange(name,Number(e.target.value))}/>
    <button className="adj-nudge" onClick={()=>onChange(name,Math.min(max,value+s))}>+</button>
    <div className="adj-val">{value}</div>
  </div>;
}

// ── URL persistence ───────────────────────────────────────────────────────
function loadFromUrl(){
  try{
    const p=new URLSearchParams(window.location.search).get('s');
    if(!p)return null;
    const d=JSON.parse(atob(p));
    return {
      ...INITIAL,...d,
      selected:{...INITIAL.selected,...(d.selected||{})},
      colors:{...INITIAL.colors,...(d.colors||{})},
      adj:{...INITIAL.adj,...(d.adj||{})},
    };
  }catch(e){return null;}
}

// ── App ───────────────────────────────────────────────────────────────────
function App(){
  const [av,setAv]=useState(()=>loadFromUrl()||JSON.parse(JSON.stringify(INITIAL)));
  const [activeCat,setActiveCat]=useState('face');
  const [subTab,setSubTab]=useState('parts');
  const [showSaveModal,setShowSaveModal]=useState(false);

  const setSelected=(k,v)=>setAv(a=>({...a,selected:{...a.selected,[k]:v}}));
  const setColor=(k,v)=>setAv(a=>({...a,colors:{...a.colors,[k]:v}}));
  const setAdj=(k,v)=>setAv(a=>({...a,adj:{...a.adj,[k]:v}}));

  const randomize=useCallback(()=>{
    const rnd=arr=>arr[Math.floor(Math.random()*arr.length)];
    setAv(a=>({...a,
      selected:{
        face:rnd(Object.keys(FACE_SHAPES)),backHair:rnd(Object.keys(BACK_HAIR)),
        frontHair:rnd(Object.keys(FRONT_HAIR)),decoHair:rnd(Object.keys(DECO_HAIR)),
        brows:rnd(Object.keys(BROW_SHAPES)),eyes:rnd(Object.keys(EYE_SHAPES)),
        nose:rnd(Object.keys(NOSE_SHAPES)),mouth:rnd(Object.keys(MOUTH_SHAPES)),
        headAccessory:rnd(Object.keys(HEAD_ACCESSORIES)),
      },
      colors:{
        skin:rnd(SKIN_COLORS),backHair:rnd(HAIR_COLORS),frontHair:rnd(HAIR_COLORS),
        decoHair:rnd(HAIR_COLORS),iris:rnd(IRIS_COLORS),lips:rnd(LIPS_COLORS),
        ink:'#2a1f1a',accent:rnd(ACC_COLORS),
      },
    }));
  },[]);

  const reset=useCallback(()=>setAv(JSON.parse(JSON.stringify(INITIAL))),[]);

  const shareUrl=useCallback(()=>{
    try{
      const enc=btoa(JSON.stringify(av));
      const url=`${location.origin}${location.pathname}?s=${enc}`;
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert('URLをコピーしました！'));
      else{prompt('URLをコピーしてください：',url);}
    }catch(e){alert('共有エラー');}
  },[av]);

  const doExport=useCallback((bgOpt)=>{
    const svgEl=document.getElementById('main-face-svg');
    if(!svgEl){alert('SVGが見つかりません');return;}
    const serializer=new XMLSerializer();
    const svgStr=serializer.serializeToString(svgEl);
    const svgBlob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(svgBlob);
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=680; canvas.height=800;
      const ctx=canvas.getContext('2d');
      if(bgOpt==='white'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,680,800);}
      else if(bgOpt==='cream'){ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,680,800);}
      ctx.drawImage(img,0,0,680,800);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='nigaoe.png';
        a.click();
      },'image/png');
    };
    img.onerror=()=>alert('エクスポートに失敗しました');
    img.src=url;
    setShowSaveModal(false);
  },[]);

  // Compute what adjustments apply to active cat
  const adjRows=useMemo(()=>{
    if(activeCat==='face') return [
      {label:'横幅',name:'faceW',min:70,max:130,step:2},
      {label:'縦幅',name:'faceH',min:70,max:130,step:2},
    ];
    if(activeCat==='eyes') return [
      {label:'縦位置',name:'eyeY',min:145,max:205,step:1},
      {label:'横間隔',name:'eyeX',min:25,max:75,step:1},
      {label:'サイズ',name:'eyeSize',min:60,max:150,step:2},
    ];
    if(activeCat==='brows') return [
      {label:'縦位置',name:'browY',min:120,max:162,step:1},
      {label:'角度',name:'browAngle',min:-20,max:20,step:1},
    ];
    if(activeCat==='nose') return [
      {label:'縦位置',name:'noseY',min:185,max:238,step:1},
      {label:'サイズ',name:'noseSize',min:60,max:140,step:2},
    ];
    if(activeCat==='mouth') return [
      {label:'縦位置',name:'mouthY',min:220,max:278,step:1},
      {label:'サイズ',name:'mouthSize',min:60,max:140,step:2},
    ];
    return [];
  },[activeCat]);

  // Color sections for panel
  const colorSections=useMemo(()=>{
    const skinSec={label:'肌色',palette:SKIN_COLORS,key:'skin'};
    if(activeCat==='backHair') return [skinSec,{label:'後ろ髪',palette:HAIR_COLORS,key:'backHair'}];
    if(activeCat==='frontHair') return [skinSec,{label:'前髪',palette:HAIR_COLORS,key:'frontHair'}];
    if(activeCat==='decoHair') return [skinSec,{label:'装飾髪',palette:HAIR_COLORS,key:'decoHair'}];
    if(activeCat==='eyes') return [skinSec,{label:'瞳',palette:IRIS_COLORS,key:'iris'}];
    if(activeCat==='mouth') return [skinSec,{label:'唇',palette:LIPS_COLORS,key:'lips'}];
    if(activeCat==='headAccessory') return [skinSec,{label:'アクセ色',palette:ACC_COLORS,key:'accent'}];
    return [
      skinSec,
      {label:'後ろ髪',palette:HAIR_COLORS,key:'backHair'},
      {label:'前髪',palette:HAIR_COLORS,key:'frontHair'},
      {label:'装飾髪',palette:HAIR_COLORS,key:'decoHair'},
      {label:'瞳',palette:IRIS_COLORS,key:'iris'},
      {label:'唇',palette:LIPS_COLORS,key:'lips'},
      {label:'アクセ色',palette:ACC_COLORS,key:'accent'},
    ];
  },[activeCat]);

  const partIds=getPartIds(activeCat);
  const catLabel=CATS.find(c=>c.id===activeCat)?.label||'';

  const bgColors={white:'#ffffff',cream:'#faf6ef',transparent:null};

  return <div id="app-root">
    {/* ── Header ─── */}
    <div className="header">
      <div className="logo">似顔絵<span>メーカー</span></div>
      <button className="btn" onClick={randomize}>ランダム</button>
      <button className="btn" onClick={reset}>リセット</button>
      <button className="btn" onClick={shareUrl}>共有URL</button>
      <button className="btn" onClick={()=>setShowSaveModal(true)}>PNG保存</button>
      <button className={`btn${av.sketch?' btn-active':''}`} onClick={()=>setAv(a=>({...a,sketch:!a.sketch}))}>スケッチ</button>
    </div>

    {/* ── Category Tabs ─── */}
    <div className="cat-bar">
      {CATS.map(c=><div key={c.id} className={`cat-tab${activeCat===c.id?' active':''}`}
        onClick={()=>{setActiveCat(c.id);setSubTab('parts');}}>{c.label}</div>)}
    </div>

    {/* ── Main ─── */}
    <div className="main">
      {/* Preview */}
      <div className="preview-area">
        <div className="preview-wrap">
          <FaceSvg av={av} svgId="main-face-svg"/>
        </div>
      </div>

      {/* Right Panel */}
      <div className="panel-area">
        <div className="sub-tabs">
          <button className={`sub-tab${subTab==='parts'?' active':''}`} onClick={()=>setSubTab('parts')}>パーツ</button>
          <button className={`sub-tab${subTab==='color'?' active':''}`} onClick={()=>setSubTab('color')}>カラー</button>
          <button className={`sub-tab${subTab==='adj'?' active':''}`} onClick={()=>setSubTab('adj')}>配置</button>
        </div>

        <div className="sub-content">
          {/* Parts Tab */}
          {subTab==='parts'&&<div className="parts-grid">
            {partIds.map(id=><Thumbnail key={id} cat={activeCat} partId={id}
              isActive={av.selected[activeCat]===id} onClick={()=>setSelected(activeCat,id)}/>)}
          </div>}

          {/* Color Tab */}
          {subTab==='color'&&<>
            {colorSections.map(s=><ColorSection key={s.key} label={s.label} palette={s.palette}
              activeColor={av.colors[s.key]} onPick={v=>setColor(s.key,v)}/>)}
            <div className="color-section">
              <div className="color-section-title">背景色</div>
              <div className="bg-row">
                {[['white','白','#ffffff'],['cream','クリーム','#faf6ef'],['transparent','透明',null]].map(([id,lbl,clr])=><>
                  <div key={id} className={`bg-opt${av.bg===id?' active':''}`}
                    style={{background:clr||undefined,
                      backgroundImage:clr?undefined:'repeating-conic-gradient(#ccc 0% 25%, transparent 0% 50%) 0 0/12px 12px',
                      border:`2.5px solid ${av.bg===id?'#1a1714':'#e4dfd8'}`}}
                    title={lbl} onClick={()=>setAv(a=>({...a,bg:id}))}/>
                </>)}
              </div>
            </div>
          </>}

          {/* Adj Tab */}
          {subTab==='adj'&&<>
            {adjRows.length>0&&<div className="adj-section">
              <div className="adj-label">{catLabel}の配置</div>
              {adjRows.map(r=><AdjRow key={r.name} {...r} value={av.adj[r.name]} onChange={setAdj}/>)}
            </div>}
            {adjRows.length===0&&<div className="no-adj">このカテゴリに専用配置設定はありません</div>}
            <div className="adj-section">
              <div className="adj-label">全パーツ共通</div>
              <AdjRow label="目・縦" name="eyeY" min={145} max={205} step={1} value={av.adj.eyeY} onChange={setAdj}/>
              <AdjRow label="目・横" name="eyeX" min={25} max={75} step={1} value={av.adj.eyeX} onChange={setAdj}/>
              <AdjRow label="目サイズ" name="eyeSize" min={60} max={150} step={2} value={av.adj.eyeSize} onChange={setAdj}/>
              <AdjRow label="眉・縦" name="browY" min={120} max={162} step={1} value={av.adj.browY} onChange={setAdj}/>
              <AdjRow label="眉角度" name="browAngle" min={-20} max={20} step={1} value={av.adj.browAngle} onChange={setAdj}/>
              <AdjRow label="鼻・縦" name="noseY" min={185} max={238} step={1} value={av.adj.noseY} onChange={setAdj}/>
              <AdjRow label="鼻サイズ" name="noseSize" min={60} max={140} step={2} value={av.adj.noseSize} onChange={setAdj}/>
              <AdjRow label="口・縦" name="mouthY" min={220} max={278} step={1} value={av.adj.mouthY} onChange={setAdj}/>
              <AdjRow label="口サイズ" name="mouthSize" min={60} max={140} step={2} value={av.adj.mouthSize} onChange={setAdj}/>
              <AdjRow label="顔・横幅" name="faceW" min={70} max={130} step={2} value={av.adj.faceW} onChange={setAdj}/>
              <AdjRow label="顔・縦幅" name="faceH" min={70} max={130} step={2} value={av.adj.faceH} onChange={setAdj}/>
            </div>
          </>}
        </div>
      </div>
    </div>

    {/* ── Save Modal ─── */}
    {showSaveModal&&<div className="modal-overlay" onClick={()=>setShowSaveModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>背景を選んで保存</h3>
        <p>PNG形式でダウンロードします</p>
        <div className="modal-btns">
          <button className="btn btn-primary" onClick={()=>doExport('white')}>白背景</button>
          <button className="btn btn-primary" onClick={()=>doExport('cream')}>クリーム</button>
          <button className="btn btn-primary" onClick={()=>doExport('transparent')}>透明</button>
        </div>
        <div className="modal-cancel">
          <button className="btn" onClick={()=>setShowSaveModal(false)}>キャンセル</button>
        </div>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
