<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パーツ管理 | にがおえメーカー</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3f0;--surf:#fff;--bd:#e4dfd8;--bd2:#ccc7bf;
  --tx:#1a1714;--mu:#8a8278;--acc:#1a1714;--red:#d04040;
}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;min-height:100vh}

header{background:var(--surf);border-bottom:1.5px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-size:15px;font-weight:700;flex:1}
.logo span{color:var(--mu);font-weight:400;font-size:13px}
a.btn,button.btn{padding:6px 14px;border:1.5px solid var(--bd2);background:var(--surf);color:var(--tx);font-family:inherit;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .15s}
a.btn:hover,button.btn:hover{background:var(--bg);border-color:var(--tx)}
button.btn-primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.btn-primary:hover{background:#3a2f28}
button.btn-primary:disabled{background:#aaa;border-color:#aaa;cursor:not-allowed}
button.btn-danger{color:var(--red);border-color:var(--red)}
button.btn-danger:hover{background:#fff0f0}

.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 53px)}

.upload-panel{background:var(--surf);border-right:1.5px solid var(--bd);padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.upload-panel h2{font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--mu)}
.field select,.field input[type=text]{padding:7px 10px;border:1.5px solid var(--bd);border-radius:7px;font-family:inherit;font-size:13px;background:var(--surf);color:var(--tx);width:100%}
.field select:focus,.field input:focus{outline:none;border-color:var(--acc)}

.dropzone{border:2px dashed var(--bd2);border-radius:12px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s;background:#faf9f7;aspect-ratio:340/400}
.dropzone:hover,.dropzone.over{border-color:var(--acc)}
.guide-svg{width:100%;height:100%;position:absolute;inset:0}
.preview-img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;display:none}
.drop-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drop-text.hidden{opacity:0;pointer-events:none}
.drop-title{font-size:13px;font-weight:600;color:var(--mu)}
.drop-sub{font-size:11px;color:var(--bd2)}
.file-btn{pointer-events:all;padding:5px 12px;border:1.5px solid var(--bd2);background:var(--surf);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx)}

.hint{font-size:11px;color:var(--mu);line-height:1.6;padding:8px 10px;background:var(--bg);border-radius:7px;border:1px solid var(--bd)}
.hint b{color:var(--tx)}

.eye-option{background:#f0f4ff;border:1.5px solid #c0d0f0;border-radius:8px;padding:10px 12px;font-size:12px;display:none;flex-direction:column;gap:6px}
.eye-option.show{display:flex}
.eye-option label{display:flex;align-items:center;gap:6px;cursor:pointer}

.list-panel{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.list-header{display:flex;align-items:center;gap:10px}
.list-header h2{font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1}
.list-header select{padding:5px 8px;border:1.5px solid var(--bd);border-radius:6px;font-family:inherit;font-size:12px;background:var(--surf)}

.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.part-item{background:var(--surf);border:1.5px solid var(--bd);border-radius:10px;overflow:hidden}
.part-thumb-wrap{aspect-ratio:340/400;background:#f5f3f0;overflow:hidden}
.part-thumb-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.part-item-body{padding:6px 8px}
.part-item-cat{font-size:10px;color:var(--mu);margin-bottom:2px}
.part-item-row{display:flex;align-items:center;gap:4px}
.part-item-label{font-size:11px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-btn{width:22px;height:22px;border:1px solid var(--red);border-radius:4px;background:#fff;color:var(--red);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .1s}
.delete-btn:hover{background:var(--red);color:#fff}

.empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--mu);font-size:13px;line-height:1.8}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1714;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
.toast.show{opacity:1}

/* 認証モーダル */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center}
.auth-modal{background:var(--surf);border-radius:14px;padding:28px;max-width:320px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.auth-modal h3{font-size:16px;font-weight:700;margin-bottom:6px}
.auth-modal p{font-size:12px;color:var(--mu);margin-bottom:14px;line-height:1.6}
.auth-modal input{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:7px;font-family:inherit;font-size:14px;margin-bottom:12px}
.auth-modal input:focus{outline:none;border-color:var(--acc)}
.auth-err{font-size:12px;color:var(--red);margin-bottom:10px;display:none}

@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .upload-panel{border-right:none;border-bottom:1.5px solid var(--bd)}
}
</style>
</head>
<body>

<header>
  <div class="logo">パーツ管理 <span>| にがおえメーカー</span></div>
  <a href="index.html" class="btn">← 本体へ</a>
</header>

<div class="layout">

  <!-- 左: アップロード -->
  <div class="upload-panel">
    <h2>パーツを追加</h2>

    <div class="field">
      <label>カテゴリ</label>
      <select id="catSelect">
        <option value="face">顔型（カスタム）</option>
        <option value="backHair">後ろ髪</option>
        <option value="frontHair">前髪</option>
        <option value="decoHair">装飾髪・結び目</option>
        <option value="brows">眉</option>
        <option value="eyes">目</option>
        <option value="nose">鼻</option>
        <option value="mouth">口</option>
        <option value="headAccessory">頭アクセサリー</option>
        <option value="other">その他・オーバーレイ</option>
      </select>
    </div>

    <div class="field">
      <label>ラベル名</label>
      <input type="text" id="labelInput" placeholder="例：丸目、ふわふわショート"/>
    </div>

    <div class="eye-option" id="eyeOption">
      <div style="font-weight:700;font-size:12px">目の設定</div>
      <label><input type="radio" name="eyeSide" value="right" checked> 右目を描いた → 左目を自動生成（推奨）</label>
      <label><input type="radio" name="eyeSide" value="left"> 左目のみ</label>
      <label><input type="radio" name="eyeSide" value="none"> 反転なし（左右対称でない目）</label>
    </div>

    <div class="dropzone" id="dropzone">
      <svg id="guideSvg" class="guide-svg" viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="170" cy="195" rx="120" ry="130" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2" stroke-dasharray="6,4"/>
        <g id="eyeGuides" style="display:none">
          <ellipse cx="118" cy="172" rx="22" ry="15" fill="none" stroke="rgba(64,128,208,0.35)" stroke-width="1.5" stroke-dasharray="4,3"/>
          <text x="118" y="176" text-anchor="middle" font-size="10" fill="rgba(64,128,208,0.5)">L</text>
          <ellipse cx="222" cy="172" rx="22" ry="15" fill="none" stroke="rgba(208,80,80,0.35)" stroke-width="1.5" stroke-dasharray="4,3"/>
          <text x="222" y="176" text-anchor="middle" font-size="10" fill="rgba(208,80,80,0.5)">R</text>
        </g>
        <g id="browGuides" style="display:none">
          <path d="M100 148 Q118 138 136 148" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-dasharray="3,3"/>
          <path d="M204 148 Q222 138 240 148" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-dasharray="3,3"/>
        </g>
        <g id="mouthGuide" style="display:none">
          <ellipse cx="170" cy="252" rx="28" ry="14" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-dasharray="4,3"/>
        </g>
      </svg>
      <img id="previewImg" class="preview-img"/>
      <div id="dropText" class="drop-text">
        <div class="drop-title">PNG をここにドロップ</div>
        <div class="drop-sub">または</div>
        <label class="file-btn">ファイルを選ぶ<input type="file" id="fileInput" accept="image/png" hidden></label>
      </div>
    </div>

    <div class="hint">
      <b>推奨: 340×400 px の透明背景 PNG</b><br>
      顔全体と同じ座標系で描いてください。<br>
      <b>目カテゴリ:</b> 右目（赤枠 R の位置）を描いて保存すると、左目が自動生成されます。
    </div>

    <button class="btn btn-primary" id="saveBtn" disabled>このパーツを保存</button>
  </div>

  <!-- 右: パーツ一覧 -->
  <div class="list-panel">
    <div class="list-header">
      <h2>登録済みパーツ</h2>
      <select id="filterCat">
        <option value="">すべて</option>
        <option value="face">顔型</option>
        <option value="backHair">後ろ髪</option>
        <option value="frontHair">前髪</option>
        <option value="decoHair">装飾髪</option>
        <option value="brows">眉</option>
        <option value="eyes">目</option>
        <option value="nose">鼻</option>
        <option value="mouth">口</option>
        <option value="headAccessory">頭アクセ</option>
        <option value="other">その他</option>
      </select>
    </div>
    <div class="parts-grid" id="partsList"></div>
  </div>

</div>

<!-- 認証モーダル -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-modal">
    <h3>管理者認証</h3>
    <p>パーツの追加・削除には管理者パスワードが必要です<br>（config.php の ADMIN_PASSWORD）</p>
    <input type="password" id="authInput" placeholder="管理者パスワード">
    <div class="auth-err" id="authErr">パスワードが違います</div>
    <button class="btn btn-primary" id="authBtn" style="width:100%">ログイン</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── API ───────────────────────────────────────────────────────
const API = '/nigaoe/api';

function adminToken() {
  return sessionStorage.getItem('ng_admin_token') || '';
}
function setAdminToken(tok) {
  sessionStorage.setItem('ng_admin_token', tok);
}
function clearAdminToken() {
  sessionStorage.removeItem('ng_admin_token');
}

async function apiFetch(path, opts = {}) {
  if (!opts.headers) opts.headers = {};
  opts.headers['X-Admin-Token'] = adminToken();
  const res  = await fetch(API + path, opts);
  const json = await res.json();
  if (res.status === 401) {
    clearAdminToken();
    showAuthModal('パスワードが違います');
    throw new Error('unauthorized');
  }
  if (!json.success) throw new Error(json.error || 'APIエラー');
  return json.data;
}

// ── 認証モーダル ─────────────────────────────────────────────
const authOverlay = document.getElementById('authOverlay');
const authInput   = document.getElementById('authInput');
const authErr     = document.getElementById('authErr');

function showAuthModal(errMsg) {
  authErr.style.display = errMsg ? 'block' : 'none';
  authErr.textContent   = errMsg || '';
  authInput.value = '';
  authOverlay.style.display = 'flex';
  setTimeout(() => authInput.focus(), 100);
}

function hideAuthModal() {
  authOverlay.style.display = 'none';
}

document.getElementById('authBtn').addEventListener('click', () => {
  const tok = authInput.value.trim();
  if (!tok) return;
  setAdminToken(tok);
  hideAuthModal();
  renderList();  // 一覧更新で認証チェック
});

authInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authBtn').click();
});

// 初回チェック: トークンがなければモーダル表示
if (!adminToken()) {
  showAuthModal('');
} else {
  hideAuthModal();
}

// ── カテゴリ表示名 ────────────────────────────────────────────
const CAT_LABELS = {
  face:'顔型', backHair:'後ろ髪', frontHair:'前髪', decoHair:'装飾髪',
  brows:'眉', eyes:'目', nose:'鼻', mouth:'口', headAccessory:'頭アクセ', other:'その他'
};

// ── UI 要素 ───────────────────────────────────────────────────
const catSelect  = document.getElementById('catSelect');
const labelInput = document.getElementById('labelInput');
const eyeOption  = document.getElementById('eyeOption');
const dropzone   = document.getElementById('dropzone');
const dropText   = document.getElementById('dropText');
const previewImg = document.getElementById('previewImg');
const saveBtn    = document.getElementById('saveBtn');
const filterCat  = document.getElementById('filterCat');
const fileInput  = document.getElementById('fileInput');
const eyeGuides  = document.getElementById('eyeGuides');
const browGuides = document.getElementById('browGuides');
const mouthGuide = document.getElementById('mouthGuide');

let pendingFile = null; // 保存待ちの File オブジェクト

// ── カテゴリ切替 ──────────────────────────────────────────────
catSelect.addEventListener('change', () => {
  const cat = catSelect.value;
  eyeOption.classList.toggle('show', cat === 'eyes');
  eyeGuides.style.display  = cat === 'eyes'  ? '' : 'none';
  browGuides.style.display = cat === 'brows' ? '' : 'none';
  mouthGuide.style.display = cat === 'mouth' ? '' : 'none';
  clearPreview();
});

function clearPreview() {
  pendingFile = null;
  previewImg.style.display = 'none';
  previewImg.src = '';
  dropText.classList.remove('hidden');
  saveBtn.disabled = true;
}

// ── ドロップ / ファイル選択 ───────────────────────────────────
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('over');
  const f = [...e.dataTransfer.files].find(f => f.type === 'image/png');
  if (f) handleFile(f);
});
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
  fileInput.value = '';
});

function handleFile(file) {
  if (file.type !== 'image/png') {
    showToast('PNG ファイルのみ対応しています');
    return;
  }
  pendingFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewImg.style.display = 'block';
  dropText.classList.add('hidden');
  saveBtn.disabled = false;
  if (!labelInput.value) {
    labelInput.value = file.name.replace(/\.png$/i, '').replace(/[-_]/g, ' ');
  }
}

// ── 保存 ──────────────────────────────────────────────────────
saveBtn.addEventListener('click', async () => {
  if (!pendingFile) return;
  const cat     = catSelect.value;
  const label   = labelInput.value.trim() || '名称未設定';
  const eyeSide = cat === 'eyes'
    ? (document.querySelector('[name=eyeSide]:checked')?.value ?? 'none')
    : 'none';

  const fd = new FormData();
  fd.append('category', cat);
  fd.append('label',    label);
  fd.append('eye_side', eyeSide);
  fd.append('image',    pendingFile, 'part.png');

  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';

  try {
    await apiFetch('/parts.php', { method: 'POST', body: fd });
    showToast('「' + label + '」を保存しました');
    clearPreview();
    labelInput.value = '';
    renderList();
  } catch (e) {
    if (e.message !== 'unauthorized') showToast('保存失敗: ' + e.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'このパーツを保存';
  }
});

// ── パーツ一覧 ────────────────────────────────────────────────
filterCat.addEventListener('change', renderList);

async function renderList() {
  try {
    const dataBycat = await apiFetch('/parts.php');
    const filterVal = filterCat.value;
    const all = [];
    Object.entries(dataBycat || {}).forEach(([cat, parts]) => {
      parts.forEach(p => all.push({...p, category: cat}));
    });
    const list = filterVal ? all.filter(p => p.category === filterVal) : all;

    if (!list.length) {
      partsList.innerHTML = '<div class="empty-state">パーツがありません<br>左のエリアから追加してください</div>';
      return;
    }

    partsList.innerHTML = list.map(p => {
      const thumb  = p.rightUrl || p.url;
      const catLbl = CAT_LABELS[p.category] || p.category;
      return `<div class="part-item">
        <div class="part-thumb-wrap">
          <img src="${thumb}" alt="${p.label}" loading="lazy">
        </div>
        <div class="part-item-body">
          <div class="part-item-cat">${catLbl}</div>
          <div class="part-item-row">
            <div class="part-item-label" title="${p.label}">${p.label}</div>
            <button class="delete-btn" onclick="deletePart(${p.id})" title="削除">×</button>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    if (e.message !== 'unauthorized') {
      partsList.innerHTML = '<div class="empty-state">読み込みに失敗しました<br>' + e.message + '</div>';
    }
  }
}

async function deletePart(id) {
  if (!confirm('このパーツを削除しますか？')) return;
  try {
    await apiFetch('/parts.php?id=' + id, { method: 'DELETE' });
    showToast('削除しました');
    renderList();
  } catch (e) {
    if (e.message !== 'unauthorized') showToast('削除失敗: ' + e.message);
  }
}

// ── Toast ─────────────────────────────────────────────────────
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

// ── 初期化 ────────────────────────────────────────────────────
if (adminToken()) renderList();
</script>
</body>
</html>
